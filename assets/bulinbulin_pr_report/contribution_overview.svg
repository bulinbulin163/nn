<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef6f2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#234" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font:700 34px "Microsoft YaHei", Arial, sans-serif;fill:#17324d}
      .sub{font:400 18px "Microsoft YaHei", Arial, sans-serif;fill:#516174}
      .card{rx:14;fill:#fff;stroke:#d7e3ee;stroke-width:1.2;filter:url(#shadow)}
      .h{font:700 21px "Microsoft YaHei", Arial, sans-serif;fill:#17324d}
      .p{font:400 16px "Microsoft YaHei", Arial, sans-serif;fill:#516174}
      .num{font:800 42px "Microsoft YaHei", Arial, sans-serif;fill:#0f766e}
      .tag{font:700 15px "Microsoft YaHei", Arial, sans-serif;fill:#fff}
      .line{stroke:#7b93aa;stroke-width:2.2;stroke-dasharray:7 8;fill:none}
    </style>
  </defs>
  <rect width="1100" height="620" fill="url(#bg)"/>
  <text x="54" y="72" class="title">bulinbulin163 的 11 次 PR 贡献总览</text>
  <text x="55" y="108" class="sub">围绕 OpenHUTB/nn 的仿真智能系统，完成从训练、仿真入口、CARLA 平台到 YOLO 规划器的工程稳健性加固。</text>

  <rect x="55" y="150" width="260" height="135" class="card"/>
  <text x="82" y="205" class="num">11</text>
  <text x="82" y="238" class="h">已合并 PR</text>
  <text x="82" y="264" class="p">2026-03-27 至 2026-04-28</text>

  <rect x="345" y="150" width="330" height="135" class="card"/>
  <text x="372" y="205" class="num">344 / 137</text>
  <text x="372" y="238" class="h">新增 / 删除代码行</text>
  <text x="372" y="264" class="p">聚焦小步、可评审、低侵入修复</text>

  <rect x="705" y="150" width="340" height="135" class="card"/>
  <text x="732" y="205" class="num">5</text>
  <text x="732" y="238" class="h">覆盖模块方向</text>
  <text x="732" y="264" class="p">CNN、AirSim、CARLA、视觉导航、YOLO</text>

  <path d="M185 315 C185 350, 185 350, 185 383" class="line"/>
  <path d="M510 315 C510 350, 510 350, 510 383" class="line"/>
  <path d="M875 315 C875 350, 875 350, 875 383" class="line"/>

  <rect x="60" y="380" width="300" height="150" class="card"/>
  <rect x="82" y="405" width="98" height="28" rx="14" fill="#2563eb"/>
  <text x="102" y="425" class="tag">项目线一</text>
  <text x="82" y="467" class="h">CARLA 多传感器平台</text>
  <text x="82" y="497" class="p">actor 生成、数据录制、终端日志</text>

  <rect x="400" y="380" width="300" height="150" class="card"/>
  <rect x="422" y="405" width="98" height="28" rx="14" fill="#0f766e"/>
  <text x="442" y="425" class="tag">项目线二</text>
  <text x="422" y="467" class="h">自动驾驶视觉导航</text>
  <text x="422" y="497" class="p">配置、模型加载、多模态融合</text>

  <rect x="740" y="380" width="300" height="150" class="card"/>
  <rect x="762" y="405" width="98" height="28" rx="14" fill="#c2410c"/>
  <text x="782" y="425" class="tag">项目线三</text>
  <text x="762" y="467" class="h">CARLA YOLO 规划器</text>
  <text x="762" y="497" class="p">TensorBoard、AEB、可视化边界</text>
</svg>
